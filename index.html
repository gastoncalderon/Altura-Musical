<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La pelotita cantora · Altura del sonido</title>
<style>
:root{--bg:#eef0ff;--fg:#14183a;--mut:#4a5080;--card:#ffffff;--acc:#d9480f;--line:#c9cdf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--fg:#f3f4ff;--mut:#a9afd8;--card:#1b1f3d;--acc:#ffb703;--line:#2f3566}}
:root[data-theme="dark"]{--bg:#0f1226;--fg:#f3f4ff;--mut:#a9afd8;--card:#1b1f3d;--acc:#ffb703;--line:#2f3566}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:12px}
h1{font-size:1.3rem;margin:4px 0 8px}
#hud{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:8px}
#next{font-size:1.6rem;font-weight:800;color:var(--acc)}
#heard{font-size:1.1rem;min-width:11ch}
#wrap{position:relative}
canvas{width:100%;display:block;border-radius:14px;border:1px solid var(--line);background:#12163a}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,12,34,.88);color:#f3f4ff;border-radius:14px;text-align:center;padding:14px;overflow:auto}
#ov h2{margin:0;font-size:1.5rem}#ov p{margin:0;max-width:52ch;color:#d5d9ff}
button{font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;border:0;background:#ffb703;color:#1b1b2f;cursor:pointer}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
#lv{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
label{color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>🎵 La pelotita cantora — Altura del sonido</h1>
<div id="hud" aria-live="polite">
 <div>Nota que viene: <span id="next">—</span></div>
 <div id="heard">Cantás: —</div>
 <div id="lives" aria-label="Vidas">♥♥♥</div>
</div>
<div id="wrap">
 <canvas id="cv" width="800" height="450"></canvas>
 <div id="ov"></div>
</div>
<div id="bar">
 <button class="sec" id="hear">🔊 Escuchar la nota</button>
 <button class="sec" id="menu">Menú</button>
 <label><input type="checkbox" id="help" checked> Mostrar ayuda visual (nombres de las notas)</label>
</div>
</main>
<script>
const NOTES={Do:0,Re:2,Mi:4,Fa:5,Sol:7,La:9,Si:11};
const CH=["Do","Do♯","Re","Re♯","Mi","Fa","Fa♯","Sol","Sol♯","La","La♯","Si"];
const LEVELS=[
 {t:"Nivel 1 · Do – Re – Mi",w:["Do","Re","Mi"],sp:85,tol:.95},
 {t:"Nivel 2 · Do a Sol",w:["Do","Re","Mi","Fa","Sol"],sp:92,tol:.85},
 {t:"Nivel 3 · La escala",w:["Do","Re","Mi","Fa","Sol","La","Si"],sp:98,tol:.8},
 {t:"Nivel 4 · Bajando",w:["Sol","Fa","Mi","Re","Do"],sp:98,tol:.8},
 {t:"Nivel 5 · Saltos",w:["Do","Mi","Sol","La","Sol","Mi","Do"],sp:105,tol:.7}
];
const $=id=>document.getElementById(id);
const cv=$("cv"),g=cv.getContext("2d"),W=800,H=450,BX=150,R=13,WW=46;
let ac,an,buf,G=null,hist=[],last=performance.now();

/* ---------- Audio ---------- */
async function initMic(){
 if(ac)return true;
 try{
  const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  ac=new (window.AudioContext||window.webkitAudioContext)();
  an=ac.createAnalyser();an.fftSize=2048;buf=new Float32Array(2048);
  ac.createMediaStreamSource(st).connect(an);return true;
 }catch(e){ac=null;return false}
}
function pitch(){ // devuelve nota MIDI (decimal) o -1
 an.getFloatTimeDomainData(buf);
 let r=0;for(let i=0;i<buf.length;i++)r+=buf[i]*buf[i];
 if(Math.sqrt(r/buf.length)<0.012)return -1;
 const sr=ac.sampleRate,mn=Math.floor(sr/900),mx=Math.floor(sr/75),n=1024,c=new Float32Array(mx+2);
 for(let l=mn;l<=mx;l++){let s=0,e=0;for(let i=0;i<n;i++){s+=buf[i]*buf[i+l];e+=buf[i]*buf[i]+buf[i+l]*buf[i+l]}c[l]=2*s/(e||1)}
 let neg=false,pk=[],mp=0;
 for(let l=mn+1;l<mx;l++){
  if(c[l]<0)neg=true;
  if(neg&&c[l]>c[l-1]&&c[l]>=c[l+1]){pk.push(l);if(c[l]>mp)mp=c[l]}
 }
 if(mp<0.6)return -1;
 const l=pk.find(x=>c[x]>=0.9*mp);
 const a=c[l-1],b=c[l],d=c[l+1],sh=(a-d)/(2*(a-2*b+d)||1),f=sr/(l+(isFinite(sh)?sh:0));
 return 69+12*Math.log2(f/440);
}
function tone(s){
 if(!ac)return;
 const f=261.63*Math.pow(2,s/12),t=ac.currentTime,o=ac.createOscillator(),v=ac.createGain();
 o.type="triangle";o.frequency.value=f;
 v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.3,t+.05);v.gain.exponentialRampToValueAtTime(.001,t+1.1);
 o.connect(v).connect(ac.destination);o.start(t);o.stop(t+1.15);
}

/* ---------- Juego ---------- */
function start(i){
 const L=LEVELS[i],ns=L.w.map(x=>NOTES[x]),mn=Math.min(...ns),mx=Math.max(...ns);
 let lo=mn-3,hi=mx+3;if(hi-lo<10){const m=(lo+hi)/2;lo=m-5;hi=m+5}
 G={i,L,lo,hi,c:(mn+mx)/2,pps:(H-80)/(hi-lo),lives:3,by:H/2,tgt:H/2,lv:0,gate:0,flash:0,state:"play",cur:-1,
  walls:ns.map((s,k)=>({x:660+k*330,s,name:L.w[k],done:false,said:false}))};
 $("ov").style.display="none";
}
const yOf=s=>H-40-(s-G.lo)*G.pps;
function fold(s){const b=G.c-6;return((s-b)%12+12)%12+b}
function nextWall(){return G.walls.find(w=>!w.done)}
function overlay(html){const o=$("ov");o.innerHTML=html;o.style.display="flex"}

function showMenu(){
 G=null;
 overlay(`<h2>¿Podés cantar la nota justa?</h2>
 <p>Sos la pelotita. Cada pared tiene un hueco y una nota. <b>Cantá esa nota</b> y tu pelotita sube o baja hasta el hueco. Cuanto más aguda la nota, más arriba; cuanto más grave, más abajo.</p>
 <p>Podés cantar en la octava que te quede cómoda (una voz grave y una aguda pueden cantar la misma nota). Si usás auriculares, el juego te escucha mejor.</p>
 <div id="lv"></div><p id="err" style="color:#ffd166"></p>`);
 LEVELS.forEach((L,i)=>{const b=document.createElement("button");b.textContent=L.t;b.onclick=async()=>{
  if(!await initMic()){$("err").textContent="No pude usar el micrófono. Revisá que el navegador tenga permiso para usarlo (y que la página se abra con https o desde GitHub Pages).";return}
  if(ac.state==="suspended")ac.resume();start(i)};$("lv").appendChild(b)});
}
function finish(win){
 const L=G.L,i=G.i,stars="★".repeat(G.lives)+"☆".repeat(3-G.lives);
 G.state=win?"win":"over";
 overlay(win?`<h2>¡Nivel superado! ${stars}</h2><p>Afinaste todas las notas de “${L.t.split("· ")[1]}”. Cuantas más vidas te queden, más estrellas.</p>
  <div>${i<LEVELS.length-1?'<button id="nx">Siguiente nivel</button> ':''}<button class="sec" id="rp">Repetir</button> <button class="sec" id="mn">Menú</button></div>`
  :`<h2>La pelotita chocó 😅</h2><p>Probá de nuevo: apretá “Escuchar la nota”, cantala bajito para ubicarla y recién entonces dejá que la pelotita avance.</p>
  <div><button id="rp">Reintentar</button> <button class="sec" id="mn">Menú</button></div>`);
 if($("nx"))$("nx").onclick=()=>start(i+1);
 $("rp").onclick=()=>start(i);$("mn").onclick=showMenu;
}

function update(dt,now){
 const a=pitch(),gated=now<G.gate;
 if(!gated){
  if(a>0){hist.push(a);if(hist.length>5)hist.shift();const m=[...hist].sort((x,y)=>x-y)[hist.length>>1];
   G.cur=m;G.lv=now;G.tgt=yOf(fold(m-60))}
  else{hist=[];if(now-G.lv>.3){G.cur=-1;G.tgt=H-30}}
 }
 G.by+=(Math.max(24,Math.min(H-24,G.tgt))-G.by)*Math.min(1,dt*12);
 G.flash=Math.max(0,G.flash-dt);
 for(const w of G.walls){
  if(w.done)continue;
  w.x-=G.L.sp*dt;
  if(!w.said&&w.x<640&&w===nextWall()){w.said=true;G.gate=now+1.2;tone(w.s)}
  const half=Math.max(24,G.L.tol*G.pps);
  if(w.x<BX+R&&w.x+WW>BX-R){
   if(Math.abs(G.by-yOf(w.s))>half){
    G.lives--;G.flash=.5;
    G.walls.forEach(q=>{if(!q.done){q.x+=300;if(q===w)q.said=false}});
    if(G.lives<=0){finish(false);return}
   }
  }else if(w.x+WW<=BX-R){w.done=true}
 }
 if(G.walls.every(w=>w.done))finish(true);
}
function hud(){
 const w=G&&nextWall();
 $("next").textContent=w?w.name:"—";
 $("lives").textContent=G?"♥".repeat(G.lives)+"♡".repeat(3-G.lives):"♥♥♥";
 if(G&&G.cur>0){const r=Math.round(G.cur),ct=Math.round((G.cur-r)*100);
  $("heard").textContent="Cantás: "+CH[((r%12)+12)%12]+" ("+(ct>=0?"+":"")+ct+" ¢)"}
 else $("heard").textContent=G?"No te escucho…":"Cantás: —";
}

/* ---------- Dibujo ---------- */
function draw(){
 const s=g.createLinearGradient(0,0,0,H);s.addColorStop(0,"#1b2160");s.addColorStop(1,"#0d1030");
 g.fillStyle=s;g.fillRect(0,0,W,H);
 if(!G)return;
 if($("help").checked){
  g.font="600 13px system-ui";g.textBaseline="middle";
  [...new Set(G.walls.map(w=>w.name))].forEach(n=>{const y=yOf(NOTES[n]);
   g.strokeStyle="rgba(255,255,255,.14)";g.setLineDash([6,8]);g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();g.setLineDash([]);
   g.fillStyle="rgba(255,255,255,.6)";g.fillText(n,8,y-9)});
 }
 const half=Math.max(24,G.L.tol*G.pps),nw=nextWall();
 for(const w of G.walls){
  if(w.x>W||w.x<-WW)continue;
  const hy=yOf(w.s);
  g.fillStyle=w===nw?"#ff7b54":"#8f6bff";
  g.fillRect(w.x,0,WW,hy-half);g.fillRect(w.x,hy+half,WW,H-hy-half);
  g.fillStyle="rgba(255,255,255,.35)";g.fillRect(w.x,hy-half-4,WW,4);g.fillRect(w.x,hy+half,WW,4);
  g.fillStyle="#fff";g.font="800 17px system-ui";g.textAlign="center";g.textBaseline="middle";
  g.fillText(w.name,w.x+WW/2,hy-half>40?hy-half-18:hy+half+18);g.textAlign="left";
 }
 const bg=g.createRadialGradient(BX-4,G.by-4,2,BX,G.by,R+2);bg.addColorStop(0,"#fff3b0");bg.addColorStop(1,"#ffb703");
 g.fillStyle=bg;g.beginPath();g.arc(BX,G.by,R,0,7);g.fill();
 g.fillStyle="#222";g.beginPath();g.arc(BX+3,G.by-3,2,0,7);g.arc(BX+8,G.by-3,2,0,7);g.fill();
 if(G.cur>0){g.strokeStyle="#ffb703";g.lineWidth=2;g.beginPath();g.arc(BX,G.by,R+5+Math.sin(performance.now()/120)*2,0,7);g.stroke();g.lineWidth=1}
 if(G.flash>0){g.fillStyle="rgba(255,60,60,"+G.flash*.5+")";g.fillRect(0,0,W,H)}
}
function loop(t){
 const dt=Math.min(.05,(t-last)/1000);last=t;
 if(G&&G.state==="play")update(dt,t/1000);
 draw();hud();requestAnimationFrame(loop);
}
$("hear").onclick=()=>{if(G&&G.state==="play"){const w=nextWall();if(w){G.gate=performance.now()/1000+1.2;tone(w.s)}}};
$("menu").onclick=showMenu;
showMenu();requestAnimationFrame(loop);
</script>
</body>
</html>

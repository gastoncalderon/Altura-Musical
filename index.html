<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La pelotita cantora · Altura del sonido</title>
<style>
:root{--bg:#e6f6ff;--fg:#26305e;--card:#ffffff;--acc:#ff6b35;--line:#b5defa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a45;--fg:#f3f4ff;--card:#232a64;--acc:#ffb703;--line:#38408a}}
:root[data-theme="dark"]{--bg:#141a45;--fg:#f3f4ff;--card:#232a64;--acc:#ffb703;--line:#38408a}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Chalkboard SE","Comic Sans MS",system-ui,sans-serif}
main{max-width:880px;margin:0 auto;padding:10px}
h1{font-size:1.35rem;margin:4px 0 8px;text-align:center}
#hud{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:6px 14px;margin-bottom:8px}
#next{display:inline-block;min-width:3.2ch;text-align:center;font-size:1.5rem;font-weight:800;color:#fff;padding:2px 14px;border-radius:14px;background:#999;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#heard{font-size:1.05rem;min-width:12ch}#lives{font-size:1.5rem;color:#ef476f}
#wrap{position:relative}
canvas{width:100%;display:block;border-radius:20px;border:4px solid var(--line);background:#8fdcff}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(255,248,230,.95);color:#26305e;border-radius:20px;text-align:center;padding:14px;overflow:auto}
#ov h2{margin:0;font-size:1.6rem}#ov p{margin:0;max-width:54ch}
button{font:inherit;font-weight:800;padding:11px 18px;border-radius:16px;border:0;background:#ff9f1c;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);text-shadow:0 1px 0 rgba(0,0,0,.25)}
button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
button.sec{background:#6c7bd9}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{font-size:1.4rem;min-width:4.2ch;padding:14px 12px}.chip.on{outline:5px solid #26305e;transform:scale(1.12)}
#bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:10px}
label{font-size:.95rem}
</style>
</head>
<body>
<main>
<h1>🎵 La pelotita cantora</h1>
<div id="hud" aria-live="polite">
 <div>Cantá: <span id="next">—</span></div>
 <div id="heard">Cantás: —</div>
 <div id="lives" aria-label="Vidas">♥♥♥</div>
</div>
<div id="wrap">
 <canvas id="cv" width="800" height="500"></canvas>
 <div id="ov"></div>
</div>
<div id="bar">
 <button class="sec" id="hear">🔊 Escuchar la nota</button>
 <button class="sec" id="menu">🏠 Menú</button>
 <label><input type="checkbox" id="help" checked> Mostrar nombres de las notas</label>
</div>
</main>
<script>
const NOTES={Do:0,Re:2,Mi:4,Fa:5,Sol:7,La:9,Si:11};
const COL={Do:"#ef476f",Re:"#ff9f1c",Mi:"#e9b800",Fa:"#3bb273",Sol:"#1fa8d6",La:"#4361ee",Si:"#9b5de5"};
const CH=["Do","Do♯","Re","Re♯","Mi","Fa","Fa♯","Sol","Sol♯","La","La♯","Si"];
const LEVELS=[
 {t:"Nivel 1 · Do – Re – Mi",w:["Do","Re","Mi"],sp:3.2,tol:.95},
 {t:"Nivel 2 · De Do a Sol",w:["Do","Re","Mi","Fa","Sol"],sp:3.5,tol:.85},
 {t:"Nivel 3 · La escala",w:["Do","Re","Mi","Fa","Sol","La","Si"],sp:3.7,tol:.8},
 {t:"Nivel 4 · Bajando la escalera",w:["Sol","Fa","Mi","Re","Do"],sp:3.7,tol:.8},
 {t:"Nivel 5 · Saltos",w:["Do","Mi","Sol","La","Sol","Mi","Do"],sp:4,tol:.7}
];
const $=id=>document.getElementById(id);
const cv=$("cv"),g=cv.getContext("2d");
const W=800,H=500,S=22,SY=100,GY=440,BX0=190,ZD=3,ZX=-20,ZY=-30,YMIN=.45,YMAX=3.4,BR=.15,TW=.9;
let ac,an,buf,G=null,hist=[],last=performance.now(),seqBusy=false;

/* ---------- Audio ---------- */
async function initMic(){
 if(ac)return true;
 try{
  const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  ac=new (window.AudioContext||window.webkitAudioContext)();
  an=ac.createAnalyser();an.fftSize=2048;buf=new Float32Array(2048);
  ac.createMediaStreamSource(st).connect(an);return true;
 }catch(e){ac=null;return false}
}
function pitch(){
 an.getFloatTimeDomainData(buf);
 let r=0;for(let i=0;i<buf.length;i++)r+=buf[i]*buf[i];
 if(Math.sqrt(r/buf.length)<0.012)return -1;
 const sr=ac.sampleRate,mn=Math.floor(sr/900),mx=Math.floor(sr/75),n=1024,c=new Float32Array(mx+2);
 for(let l=mn;l<=mx;l++){let s=0,e=0;for(let i=0;i<n;i++){s+=buf[i]*buf[i+l];e+=buf[i]*buf[i]+buf[i+l]*buf[i+l]}c[l]=2*s/(e||1)}
 let neg=false,pk=[],mp=0;
 for(let l=mn+1;l<mx;l++){
  if(c[l]<0)neg=true;
  if(neg&&c[l]>c[l-1]&&c[l]>=c[l+1]){pk.push(l);if(c[l]>mp)mp=c[l]}
 }
 if(mp<0.6)return -1;
 const l=pk.find(x=>c[x]>=0.9*mp);
 const a=c[l-1],b=c[l],d=c[l+1],sh=(a-d)/(2*(a-2*b+d)||1),f=sr/(l+(isFinite(sh)?sh:0));
 return 69+12*Math.log2(f/440);
}
function tone(s){
 if(!ac)return;
 const f=261.63*Math.pow(2,s/12),t=ac.currentTime,o=ac.createOscillator(),v=ac.createGain();
 o.type="triangle";o.frequency.value=f;
 v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.3,t+.05);v.gain.exponentialRampToValueAtTime(.001,t+1.1);
 o.connect(v).connect(ac.destination);o.start(t);o.stop(t+1.15);
}

/* ---------- Juego ---------- */
function start(i){
 const L=LEVELS[i],ns=L.w.map(x=>NOTES[x]),mn=Math.min(...ns),mx=Math.max(...ns);
 let lo=mn-1.5,hi=mx+1.5;if(hi-lo<10){const m=(lo+hi)/2;lo=m-5;hi=m+5}
 G={i,L,lo,hi,c:(mn+mx)/2,perSemi:(YMAX-YMIN)/(hi-lo),lives:3,by:.15,tgt:.15,lv:0,gate:0,flash:0,state:"play",cur:-1,travel:0,endAt:0,
  walls:ns.map((s,k)=>({x:30+k*13,s,name:L.w[k],done:false,said:false}))};
 $("ov").style.display="none";
}
const yW=s=>YMIN+(s-G.lo)*G.perSemi;
const halfH=()=>Math.max(.2,G.L.tol*G.perSemi);
function fold(s){const b=G.c-6;return((s-b)%12+12)%12+b}
function nextWall(){return G&&G.walls.find(w=>!w.done)}
function overlay(html){const o=$("ov");o.innerHTML=html;o.style.display="flex"}

function showMenu(){
 G=null;
 overlay(`<h2>¿Podés cantar la nota justa?</h2>
 <p>Sos la pelotita y avanzás por el camino. Cada pared de madera tiene un hueco y una nota. <b>Cantá esa nota</b> y tu pelotita sube o baja hasta el hueco: si es más aguda, sube; si es más grave, baja.</p>
 <p>Cantá en la altura que te quede cómoda. Si usás auriculares, el juego te escucha mejor.</p>
 <div class="row" id="lv"></div><p id="err" style="color:#c0392b;font-weight:700"></p>`);
 LEVELS.forEach((L,i)=>{const b=document.createElement("button");b.textContent=L.t;b.onclick=async()=>{
  if(!await initMic()){$("err").textContent="No pude usar el micrófono. Revisá que el navegador tenga permiso para usarlo.";return}
  if(ac.state==="suspended")ac.resume();preview(i)};$("lv").appendChild(b)});
}
function preview(i){
 G=null;const L=LEVELS[i],uniq=[...new Set(L.w)];
 overlay(`<h2>${L.t}</h2>
 <p>Primero escuchá las notas de este nivel. Tocá cada una para oírla y probá cantarla.</p>
 <div class="row" id="chips"></div>
 <div class="row"><button id="all">▶ Escuchar en orden</button><button id="go">¡A jugar! 🚀</button><button class="sec" id="bk">Volver</button></div>`);
 uniq.forEach(n=>{const b=document.createElement("button");b.className="chip";b.dataset.n=n;b.textContent=n;b.style.background=COL[n];
  b.onclick=()=>tone(NOTES[n]);$("chips").appendChild(b)});
 $("all").onclick=()=>{if(seqBusy)return;seqBusy=true;
  L.w.forEach((n,k)=>setTimeout(()=>{document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.n===n));tone(NOTES[n]);
   if(k===L.w.length-1)setTimeout(()=>{document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));seqBusy=false},900)},k*1000))};
 $("go").onclick=()=>start(i);$("bk").onclick=showMenu;
}
function finish(win){
 const i=G.i,stars="★".repeat(G.lives)+"☆".repeat(3-G.lives);
 G.state=win?"win":"over";
 overlay(win?`<h2>¡Lo lograste! ${stars}</h2><p>Pasaste todas las paredes. Cuantas más vidas te queden, más estrellas ganás.</p>
  <div class="row">${i<LEVELS.length-1?'<button id="nx">Siguiente nivel ➜</button>':''}<button class="sec" id="rp">Repetir</button><button class="sec" id="mn">Menú</button></div>`
  :`<h2>¡Uy! La pelotita chocó 😵</h2><p>Probá de nuevo. Tocá “Escuchar la nota”, cantala bajito para encontrarla y después dejá que la pelotita avance.</p>
  <div class="row"><button id="rp">Reintentar</button><button class="sec" id="pv">Escuchar las notas</button><button class="sec" id="mn">Menú</button></div>`);
 if($("nx"))$("nx").onclick=()=>preview(i+1);
 if($("pv"))$("pv").onclick=()=>preview(i);
 $("rp").onclick=()=>start(i);$("mn").onclick=showMenu;
}

function update(dt,now){
 const a=pitch(),gated=now<G.gate;
 if(!gated){
  if(a>0){hist.push(a);if(hist.length>5)hist.shift();const m=[...hist].sort((x,y)=>x-y)[hist.length>>1];
   G.cur=m;G.lv=now;G.tgt=Math.min(YMAX+.15,Math.max(BR,yW(fold(m-60))))}
  else{hist=[];if(now-G.lv>.3){G.cur=-1;G.tgt=BR}}
 }
 G.by+=(G.tgt-G.by)*Math.min(1,dt*10);
 G.flash=Math.max(0,G.flash-dt);G.travel+=G.L.sp*dt;
 for(const w of G.walls){
  w.x-=G.L.sp*dt;            // todas avanzan, también las ya pasadas (así salen de la imagen)
  if(w.done)continue;
  if(!w.said&&w.x<26&&w===nextWall()){w.said=true;G.gate=now+1.2;tone(w.s)}
  if(w.x<=.7){
   if(Math.abs(G.by-yW(w.s))<=halfH())w.done=true;
   else{G.lives--;G.flash=.6;G.walls.forEach(q=>{if(!q.done)q.x+=10});w.said=false;
    if(G.lives<=0){finish(false);return}}
  }
 }
 if(!G.endAt&&G.walls.every(w=>w.done))G.endAt=now+1.5;
 if(G.endAt&&now>G.endAt)finish(true);
}
function hud(){
 const w=nextWall(),n=$("next");
 n.textContent=w?w.name:"—";n.style.background=w?COL[w.name]:"#999";
 $("lives").textContent=G?"♥".repeat(G.lives)+"♡".repeat(3-G.lives):"♥♥♥";
 if(G&&G.cur>0){const r=Math.round(G.cur),ct=Math.round((G.cur-r)*100);
  $("heard").textContent="Cantás: "+CH[((r%12)+12)%12]+" ("+(ct>=0?"+":"")+ct+" ¢)"}
 else $("heard").textContent=G?"No te escucho…":"Cantás: —";
}

/* ---------- Dibujo 3D (vista de costado) ---------- */
const P=(x,Y,Z)=>[BX0+x*S+Z*ZX,GY-Y*SY+Z*ZY];
function poly(p,fill){g.fillStyle=fill;g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}
function scene(t){
 const HZ=330,tr=G?G.travel:t/400;
 let s=g.createLinearGradient(0,0,0,HZ);s.addColorStop(0,"#5cc8ff");s.addColorStop(1,"#d9f4ff");
 g.fillStyle=s;g.fillRect(0,0,W,HZ);
 g.fillStyle="#ffe066";g.beginPath();g.arc(670,80,34,0,7);g.fill();
 g.fillStyle="rgba(255,255,255,.9)";
 for(let k=0;k<4;k++){const x=((t/60+k*260)%1000)-120,y=50+k*30;g.beginPath();g.ellipse(x,y,48,18,0,0,7);g.ellipse(x+30,y-10,34,16,0,0,7);g.ellipse(x-28,y-6,28,13,0,0,7);g.fill()}
 g.fillStyle="#7bd36a";g.beginPath();g.moveTo(0,HZ);for(let x=0;x<=W+20;x+=20)g.lineTo(x,HZ-30-Math.sin((x+tr*10)/90)*18);g.lineTo(W,HZ);g.fill();
 g.fillStyle="#58c15a";g.beginPath();g.moveTo(0,HZ);for(let x=0;x<=W+20;x+=20)g.lineTo(x,HZ-10-Math.sin((x+tr*22)/60+2)*9);g.lineTo(W,HZ);g.fill();
 s=g.createLinearGradient(0,HZ,0,H);s.addColorStop(0,"#79d968");s.addColorStop(1,"#3fae4f");
 g.fillStyle=s;g.fillRect(0,HZ,W,H-HZ);
 poly([[-100,GY],[W+100,GY],[W+100+ZD*ZX,GY+ZD*ZY],[-100+ZD*ZX,GY+ZD*ZY]],"#7d84c4");
 g.strokeStyle="#fff";g.lineWidth=6;g.beginPath();g.moveTo(0,GY);g.lineTo(W,GY);g.stroke();
 g.lineWidth=4;g.beginPath();g.moveTo(0,GY+ZD*ZY);g.lineTo(W,GY+ZD*ZY);g.stroke();
 g.lineWidth=5;
 for(let k=0;k<12;k++){const x0=k*3-(tr%3),a=P(x0,0,1.5),b=P(x0+1.4,0,1.5);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}
}
function drawWall(w){
 const x=w.x,xr=x+TW,hy=yW(w.s),hb=hy-halfH(),ht=hy+halfH();
 if(BX0+x*S>W+80||BX0+xr*S+ZD*ZX<-20)return;
 const box=(Y0,Y1,top)=>{
  poly([P(x,Y0,0),P(x,Y0,ZD),P(x,Y1,ZD),P(x,Y1,0)],"#dba468");
  g.strokeStyle="#b98342";g.lineWidth=2;
  for(const z of[1,2]){const a=P(x,Y0,z),b=P(x,Y1,z);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}
  if(top)poly([P(x,Y1,0),P(xr,Y1,0),P(xr,Y1,ZD),P(x,Y1,ZD)],"#f6d8a2");
  poly([P(x,Y0,0),P(xr,Y0,0),P(xr,Y1,0),P(x,Y1,0)],"#c58b50");
  g.strokeStyle="#8a5a2b";g.lineWidth=2;g.beginPath();
  const p=[P(x,Y0,0),P(x,Y1,0),P(xr,Y1,0),P(xr,Y0,0)];p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke();
 };
 box(0,hb,true);box(ht,6,false);
 const c=P(x,ht+.45,1.5),cy=Math.max(26,c[1]);
 g.fillStyle=COL[w.name];g.beginPath();g.arc(c[0],cy,22,0,7);g.fill();
 g.strokeStyle="#fff";g.lineWidth=3;g.stroke();
 g.fillStyle="#fff";g.font="800 19px 'Trebuchet MS',sans-serif";g.textAlign="center";g.textBaseline="middle";
 g.fillText(w.name,c[0],cy+1);g.textAlign="left";
}
function drawBall(t){
 const bx=BX0,by=GY-G.by*SY,r=BR*SY;
 g.fillStyle="rgba(0,0,0,.25)";
 g.beginPath();g.ellipse(bx,GY+6,r*(1.3-Math.min(.5,G.by*.15)),r*.3,0,0,7);g.fill();
 if(G.cur>0){g.strokeStyle="rgba(255,255,255,.85)";g.lineWidth=3;const k=(t/400)%1;g.beginPath();g.arc(bx,by,r*(1.3+k*1.2),0,7);g.globalAlpha=1-k;g.stroke();g.globalAlpha=1}
 const bg=g.createRadialGradient(bx-r*.35,by-r*.4,r*.1,bx,by,r);bg.addColorStop(0,"#ffe08a");bg.addColorStop(1,"#ff7b2c");
 g.fillStyle=bg;g.beginPath();g.arc(bx,by,r,0,7);g.fill();g.strokeStyle="#c2491a";g.lineWidth=2;g.stroke();
 g.fillStyle="#fff";g.strokeStyle="#222";g.lineWidth=2;
 for(const dx of[-.1,.5]){const ex=bx+dx*r,ey=by-.2*r;
  if(G.flash>0){g.beginPath();g.moveTo(ex-4,ey-4);g.lineTo(ex+4,ey+4);g.moveTo(ex+4,ey-4);g.lineTo(ex-4,ey+4);g.stroke()}
  else{g.beginPath();g.arc(ex,ey,r*.26,0,7);g.fill();g.stroke();g.fillStyle="#222";g.beginPath();g.arc(ex+r*.1,ey,r*.11,0,7);g.fill();g.fillStyle="#fff"}}
 g.fillStyle="#7a1d0c";g.strokeStyle="#7a1d0c";g.beginPath();
 if(G.cur>0){g.ellipse(bx+r*.3,by+.4*r,r*.2,r*.25,0,0,7);g.fill()}else{g.arc(bx+r*.3,by+.2*r,r*.3,.2,Math.PI-.2);g.stroke()}
}
function guide(){
 const y=GY-G.by*SY;g.save();g.strokeStyle="rgba(255,255,255,.6)";g.lineWidth=3;g.setLineDash([10,10]);
 g.beginPath();g.moveTo(BX0+BR*SY+6,y);g.lineTo(W,y);g.stroke();g.restore();
}
function gauge(){
 const x=24,top=70,bot=450,h=bot-top;
 g.fillStyle="rgba(255,255,255,.85)";g.beginPath();g.roundRect(x-11,top-12,22,h+24,11);g.fill();
 g.font="700 13px 'Trebuchet MS',sans-serif";g.textBaseline="middle";
 const yy=s=>bot-(s-G.lo)/(G.hi-G.lo)*h;
 [...new Set(G.walls.map(w=>w.name))].forEach(n=>{const y=yy(NOTES[n]);
  g.fillStyle=COL[n];g.beginPath();g.arc(x,y,8,0,7);g.fill();
  if($("help").checked){g.fillStyle="#26305e";g.fillText(n,x+16,y)}});
 if(G.cur>0){const y=Math.max(top-8,Math.min(bot+8,yy(fold(G.cur-60))));
  g.fillStyle="#26305e";g.beginPath();g.moveTo(x-18,y-8);g.lineTo(x-18,y+8);g.lineTo(x-5,y);g.fill()}
 g.fillStyle="#26305e";g.fillText("Tu voz",x-14,top-26);
}
function draw(t){
 scene(t);
 if(!G)return;
 const ws=[...G.walls].sort((a,b)=>b.x-a.x);
 for(const w of ws)drawWall(w);
 if(G.state==="play")guide();
 drawBall(t);
 gauge();
 if(G.flash>0){g.fillStyle="rgba(255,70,70,"+G.flash*.45+")";g.fillRect(0,0,W,H)}
}
function loop(t){
 const dt=Math.min(.05,(t-last)/1000);last=t;
 if(G&&G.state==="play")update(dt,t/1000);
 draw(t);hud();requestAnimationFrame(loop);
}
$("hear").onclick=()=>{const w=nextWall();if(G&&G.state==="play"&&w){G.gate=performance.now()/1000+1.2;tone(w.s)}};
$("menu").onclick=showMenu;
showMenu();requestAnimationFrame(loop);
</script>
</body>
</html>
